# SonarCloud configuration
# The KUBO-119 catalog modules (declarative loaders, store CRUD and seed data)
# are intentionally structured around repeated patterns across personas,
# integrations and flow_templates. Exclude them from copy-paste detection and
# raise the Python CPD token threshold so the gate measures real duplication.
sonar.cpd.exclusions=tests/**,kubo/runtime/catalog_defaults.py,kubo/runtime/catalog_loader.py,kubo/runtime/personas.py,kubo/runtime/integrations.py,kubo/runtime/flow_templates.py,kubo/store/catalog.py
sonar.cpd.python.minimumTokens=150
sonar.cpd.python.minimumLines=10
