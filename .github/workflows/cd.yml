# workflow-cd.yml — esteira build-once / promote-by-digest (ADR-0037).
#
# Jobs:
#   build    — builda a imagem uma vez por commit e publica no GHCR por SHA.
#   deploy-dev — merge em main auto-deploya o kubo-test.
#   deploy-prd — workflow_dispatch, gated pelo Environment `prd`, com binding do digest.
#
# Pré-requisitos (use scripts/ops/fatia-c-setup-*.sh):
#   - Pacote GHCR público e visível (KUBO-99).
#   - Auth keys Tailscale taggeadas cd-dev/cd-prd (KUBO-100).
#   - Environment `prd` com required reviewer e segredos (KUBO-103).

name: cd

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  IMAGE_REPO: ghcr.io/renatobardi/kubo

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
      image: ${{ steps.meta.outputs.image }}
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0
      - uses: docker/login-action@b45d80f862d83dbcd57f89517bcf500b2ab88fb2 # v4.0.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Meta
        id: meta
        run: |
          echo "image=${{ env.IMAGE_REPO }}:${{ github.sha }}" >> "$GITHUB_OUTPUT"
      - name: Build and push
        id: build
        uses: docker/build-push-action@d08e5c354a6adb9ed34480a06d141179aa583294 # v7.0.0
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.image }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # Não assamos segredos; o .env do servidor é lido em runtime (invariante 8).

  deploy-dev:
    needs: build
    runs-on: ubuntu-24.04-arm
    # Só em push: workflow_dispatch é usado para promover a PRD (collect-digest +
    # deploy-prd), e um redeploy do DEV em paralelo corre com a leitura do digest
    # vivo em collect-digest — já aconteceu (digest capturado vazio, container no
    # meio da troca).
    if: github.event_name == 'push'
    environment: dev
    concurrency:
      group: cd-dev
      cancel-in-progress: false
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - name: Tailscale (dev identity)
        uses: tailscale/github-action@2976a889fced77bb9d364be5297d56cbd6f178d8 # v4.0.0
        with:
          authkey: ${{ secrets.TS_AUTHKEY_DEV }}
          tags: tag:cd-dev
      - name: Sync repo → kubo-test
        env:
          HOST: ${{ secrets.KUBO_TEST_HOST }}
        run: |
          rsync -az --delete \
            --exclude='.git' --exclude='.venv' --exclude='__pycache__' \
            --exclude='.pytest_cache' --exclude='.ruff_cache' --exclude='.coverage' \
            --exclude='.env' \
            -e 'ssh -o StrictHostKeyChecking=no' \
            ./ "${HOST}:kubo/"
      - name: Deploy to kubo-test
        env:
          DIGEST: ${{ needs.build.outputs.digest }}
          HOST: ${{ secrets.KUBO_TEST_HOST }}
        run: |
          ssh -o StrictHostKeyChecking=no "${HOST}" \
            "cd ~/kubo && bash scripts/deploy-remote.sh '${DIGEST}'" < /dev/null

  collect-digest:
    needs: build
    runs-on: ubuntu-24.04-arm
    if: github.event_name == 'workflow_dispatch'
    environment: dev
    permissions:
      contents: read
    outputs:
      digest: ${{ steps.collect.outputs.digest }}
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - name: Tailscale (dev identity)
        uses: tailscale/github-action@2976a889fced77bb9d364be5297d56cbd6f178d8 # v4.0.0
        with:
          authkey: ${{ secrets.TS_AUTHKEY_DEV }}
          tags: tag:cd-dev
      # `docker inspect` num CONTAINER não tem campo `.RepoDigests` (isso só existe em
      # IMAGE) — sempre falhava com "map has no entry for key RepoDigests" e o erro ia
      # pro stderr, então o pipe via stdout ficava vazio silenciosamente. `.Config.Image`
      # (presente no container) já traz `repo@sha256:...` quando a imagem foi puxada por
      # digest — mesmo fallback que scripts/digest_guard.py usa.
      - name: Coletar digest vivo do kubo-test
        id: collect
        env:
          HOST: ${{ secrets.KUBO_TEST_HOST }}
        run: |
          live_digest=$(ssh -o StrictHostKeyChecking=no "${HOST}" \
            "cd ~/kubo && docker compose ps -q kubo-api | xargs -r docker inspect --format '{{.Config.Image}}' | sed -E 's/.*@sha256://'")
          if [ -z "$live_digest" ]; then
            echo "::error::Não foi possível ler o digest vivo do kubo-api em kubo-test"
            exit 1
          fi
          echo "digest=${live_digest}" >> "$GITHUB_OUTPUT"
          echo "::notice::Digest vivo em kubo-test: sha256:${live_digest}"

  deploy-prd:
    needs: [build, collect-digest]
    runs-on: ubuntu-24.04-arm
    environment: prd
    concurrency:
      group: cd-prd
      cancel-in-progress: false
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - name: Tailscale (prd identity)
        uses: tailscale/github-action@2976a889fced77bb9d364be5297d56cbd6f178d8 # v4.0.0
        with:
          authkey: ${{ secrets.TS_AUTHKEY_PRD }}
          tags: tag:cd-prd
      # Revalida contra o kubo-test (não o kubo-prd): fecha a "race do DEV-que-andou"
      # (ADR-0037 §IV) — entre a coleta pré-gate e a aprovação, um merge novo pode ter
      # trocado o digest vivo no DEV. Aborta se o que foi homologado já não é mais atual.
      - name: Revalidar digest antes do deploy
        env:
          EXPECTED: ${{ needs.collect-digest.outputs.digest }}
          HOST: ${{ secrets.KUBO_TEST_HOST }}
        run: |
          live_digest=$(ssh -o StrictHostKeyChecking=no "${HOST}" \
            "cd ~/kubo && docker compose ps -q kubo-api | xargs -r docker inspect --format '{{.Config.Image}}' | sed -E 's/.*@sha256://'")
          if [ -z "$EXPECTED" ] || [ -z "$live_digest" ] || [ "$live_digest" != "$EXPECTED" ]; then
            echo "::error::Digest do kubo-test mudou desde a homologação (aprovado sha256:${EXPECTED}, agora vivo sha256:${live_digest}) — dispare a promoção de novo"
            exit 1
          fi
      - name: Backup antes de migrar
        env:
          HOST: ${{ secrets.KUBO_PRD_HOST }}
        run: |
          ssh -o StrictHostKeyChecking=no "${HOST}" \
            "cd ~/kubo && docker compose exec -T backup sh -c 'date -u +%Y%m%dT%H%M%SZ > /backups/.pre-migration-marker'" < /dev/null
      - name: Sync repo → kubo-prd
        env:
          HOST: ${{ secrets.KUBO_PRD_HOST }}
        run: |
          rsync -az --delete \
            --exclude='.git' --exclude='.venv' --exclude='__pycache__' \
            --exclude='.pytest_cache' --exclude='.ruff_cache' --exclude='.coverage' \
            --exclude='.env' \
            -e 'ssh -o StrictHostKeyChecking=no' \
            ./ "${HOST}:kubo/"
      # Promove exatamente o digest homologado e aprovado (needs.collect-digest), não um
      # rebuild do dispatch atual (needs.build) — build não é bit-reproducible e o ponto do
      # gate é aprovar bytes específicos (ADR-0037 §I, §IV.3).
      - name: Deploy to kubo-prd
        env:
          DIGEST: ${{ needs.collect-digest.outputs.digest }}
          HOST: ${{ secrets.KUBO_PRD_HOST }}
        run: |
          ssh -o StrictHostKeyChecking=no "${HOST}" \
            "cd ~/kubo && bash scripts/deploy-remote.sh '${DIGEST}'" < /dev/null
