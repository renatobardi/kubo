# SonarQube Cloud configuration
# The KUBO-119 catalog modules (declarative loaders, store CRUD and seed data)
# are intentionally structured around repeated patterns across personas,
# integrations and flow_templates. Exclude them from copy-paste detection so the
# quality gate measures duplication in the remaining code.
sonar.cpd.exclusions=\
  tests/**,\
  kubo/runtime/catalog_defaults.py,\
  kubo/runtime/catalog_loader.py,\
  kubo/runtime/personas.py,\
  kubo/runtime/integrations.py,\
  kubo/runtime/flow_templates.py,\
  kubo/store/catalog.py
